<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Play Store</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #f0f2f5;
        }
        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .login-logo {
            width: 48px;
            margin-bottom: 20px;
        }
        .error-msg {
            color: #d93025;
            background: #fce8e6;
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="https://www.gstatic.com/android/market_images/web/play_prism_h_64.png" alt="Play Store" class="login-logo">
        <h2 style="margin-bottom: 8px;">Sign in</h2>
        <p style="color: var(--text-muted); margin-bottom: 32px;">Use your Play Store Account</p>
        
        <div id="errorMsg" class="error-msg"></div>

        <form id="loginForm">
            <div class="form-group" style="text-align: left;">
                <label>Email</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>
            <div class="form-group" style="text-align: left;">
                <label>Password</label>
                <input type="password" id="password" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Sign In</button>
        </form>

        <div style="margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 24px;">
            <button id="googleLogin" class="btn btn-outline" style="width: 100%;">
                <img src="https://www.gstatic.com/images/branding/product/1x/gsa_512dp.png" style="width: 18px;" alt="">
                Sign in with Google
            </button>
        </div>

        <p style="margin-top: 24px; font-size: 14px; color: var(--text-muted);">
            Need an account? <span style="color: var(--primary-color)">Contact Admin</span>
        </p>
        <a href="index.html" style="display: block; margin-top: 16px; font-size: 14px; color: var(--primary-color)">Back to Store</a>
    </div>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
