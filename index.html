<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Play Store Clone</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container nav-content">
            <div class="logo">
                <img src="https://www.gstatic.com/android/market_images/web/play_prism_h_64.png" alt="Google Play">
                <span>Play Store</span>
            </div>
            <div class="search-bar">
                <i class="fa fa-search" style="color: var(--text-muted)"></i>
                <input type="text" id="searchInput" placeholder="Search for apps & games">
            </div>
            <div class="nav-actions" style="display: flex; gap: 15px; align-items: center;">
                <button id="themeToggle" class="btn" style="background:none; color: var(--text-muted)"><i class="fa fa-moon"></i></button>
                <a href="login.html" class="btn btn-outline">Publisher Login</a>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="filters" style="padding: 20px 0; display: flex; gap: 10px; overflow-x: auto;">
            <button class="btn btn-outline active" data-category="all">All</button>
            <button class="btn btn-outline" data-category="Games">Games</button>
            <button class="btn btn-outline" data-category="Apps">Apps</button>
            <button class="btn btn-outline" data-category="Productivity">Productivity</button>
            <button class="btn btn-outline" data-category="Social">Social</button>
        </section>

        <section id="appGrid" class="app-grid">
            <!-- Apps will be injected here by JavaScript -->
            <div class="loading-spinner" style="grid-column: 1/-1; text-align: center; padding: 50px;">
                <i class="fa fa-circle-notch fa-spin fa-2x" style="color: var(--primary-color)"></i>
            </div>
        </section>
    </main>

    <!-- App Details Modal -->
    <div id="detailsModal" class="modal-overlay">
        <div class="modal">
            <button class="close-modal" style="position: absolute; right: 20px; top: 20px; background:none; border:none; font-size: 20px; cursor: pointer; color: var(--text-muted)">&times;</button>
            <div class="modal-header" style="display: flex; gap: 20px; margin-bottom: 24px;">
                <img id="modalLogo" class="app-logo" style="width: 96px; height: 96px; margin: 0;" src="" alt="">
                <div>
                    <h2 id="modalTitle" style="font-size: 24px; margin-bottom: 4px;"></h2>
                    <p id="modalPublisher" style="color: var(--primary-color); font-weight: 500;"></p>
                    <p id="modalCategory" style="font-size: 14px; color: var(--text-muted);"></p>
                </div>
            </div>
            <div class="modal-actions" style="margin-bottom: 32px;">
                <a id="downloadBtn" href="#" target="_blank" class="btn btn-primary" style="width: 100%;">Install</a>
            </div>
            <div class="modal-info">
                <h3 style="font-size: 18px; margin-bottom: 12px;">About this app</h3>
                <p id="modalDescription" style="color: var(--text-muted); font-size: 14px; line-height: 1.6;"></p>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 20px;">
                    <div>
                        <p style="font-size: 12px; color: var(--text-muted);">Package Name</p>
                        <p id="modalPackage" style="font-size: 14px;"></p>
                    </div>
                    <div>
                        <p style="font-size: 12px; color: var(--text-muted);">Version</p>
                        <p id="modalVersion" style="font-size: 14px;">1.0.0</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/store.js"></script>
</body>
</html>
